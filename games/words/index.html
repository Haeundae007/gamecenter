<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:type" content="website">

<meta property="og:description" content="반응속도 테스트 · 심해 생물 만들기 · 흡연충뻑치기게임 · 하고 싶은 말">

<style>
/* 레이아웃: 화면 전체가 안개 낀 들판. 아래에 흰 바탕·검은 선의 입력 줄 하나만 얹는다. */
:root {
  --paper: #ffffff;
  --ink: #111111;
  --haze: #b9c5cf;
  --sans: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--haze); color: var(--ink); overflow: hidden; font-family: var(--sans); }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#panel {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center;
}
#form { width: min(640px, 100%); background: var(--paper); border: 2px solid var(--ink); display: grid; grid-template-columns: minmax(70px, 8.5rem) 1fr auto; }
#who { min-width: 0; border: 0; border-right: 2px solid var(--ink); padding: 14px 12px; font: 500 16px/1.2 var(--sans); color: var(--ink); background: var(--paper); outline: none; }
#who:focus-visible { box-shadow: inset 0 0 0 3px var(--ink); }
#word { min-width: 0; border: 0; padding: 14px 16px; font: 500 18px/1.2 var(--sans); color: var(--ink); background: var(--paper); outline: none; }
#word::placeholder { color: #6b6b6b; }
#send { border: 0; border-left: 2px solid var(--ink); padding: 0 22px; font: 700 17px/1 var(--sans); background: var(--paper); color: var(--ink); cursor: pointer; }
#send:hover, #send:focus-visible { background: var(--ink); color: var(--paper); }
#word:focus-visible { box-shadow: inset 0 0 0 3px var(--ink); }
#hint { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 600 14px/1.3 var(--sans); color: var(--ink); pointer-events: none; }
#hint span { background: var(--paper); border: 2px solid var(--ink); padding: 6px 10px; }
#soundBtn { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 8px 12px; font: 600 14px/1 var(--sans); cursor: pointer; }
#soundBtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#inboxBtn { position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 8px 12px; font: 600 14px/1 var(--sans); cursor: pointer; }
#inbox { position: fixed; top: calc(104px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(360px, calc(100% - 32px)); max-height: 60%; overflow-y: auto; background: var(--paper); border: 2px solid var(--ink); }
#inbox h2 { margin: 0; padding: 10px 12px; font: 700 15px/1.2 var(--sans); border-bottom: 2px solid var(--ink); }
#inbox ol { list-style: none; margin: 0; padding: 0; }
#inbox li { padding: 8px 12px; border-bottom: 1px solid var(--ink); font: 500 14px/1.4 var(--sans); }
#inbox li b { margin-right: 6px; }
#inbox li small { display: block; color: #555; }
#note { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); background: var(--paper); border: 2px solid var(--ink); padding: 8px 12px; font: 600 14px/1.3 var(--sans); }
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div id="note"><a href="../../#/" style="color:inherit">게임센터</a></div>
<button id="soundBtn" type="button" aria-pressed="true">소리 끄기</button>
<button id="inboxBtn" type="button" hidden>받은 말</button>
<section id="inbox" hidden><h2>받은 말 (나만 보임)</h2><ol id="inboxList"></ol></section>
<div id="hint" hidden><span id="hintText"></span></div>
<div id="panel">
  <form id="form" autocomplete="off">
    <input id="who" maxlength="12" placeholder="이름" aria-label="이름">
    <input id="word" maxlength="8" placeholder="하고 싶은 말 (8자까지)" aria-label="하고 싶은 말">
    <button id="send" type="submit">보내기</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  if (typeof THREE === 'undefined') { $('note').textContent = '3D 도구를 불러오지 못했습니다. 새로고침해 주세요.'; return; }
  var T = THREE;

  var mobile = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700;
  // 그래픽 카드 없이 CPU로 그리는 환경(원격 PC, 드라이버 없음 등)은 아주 가볍게.
  var slowGpu = (function () {
    try {
      var gl = document.createElement('canvas').getContext('webgl');
      if (!gl) return true;
      var ext = gl.getExtension('WEBGL_debug_renderer_info');
      var name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
      return /SwiftShader|Basic Render|llvmpipe|Software|softpipe/i.test(name);
    } catch (e) { return true; }
  })();
  var N = slowGpu ? 1600 : mobile ? 2600 : 4200;
  var REEDS = slowGpu ? 22000 : mobile ? 16000 : 34000;
  var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 안개 낀 아침의 색 ---------- */
  var C = {
    top: '#aec3da', mid: '#bdc8d2', fog: '#c4ccd3', density: 0.0095,
    ground: '#66625a', reedA: '#7b6a57', reedB: '#3b3129', plume: '#8f8274',
    tree: '#202426', bird: '#262b30', mist: '#dce2e7'
  };
  function col(h) { return new T.Color(h); }

  var scene3 = new T.Scene();
  scene3.fog = new T.FogExp2(col(C.fog), C.density);
  document.body.style.background = C.fog;
  var renderer;
  try { renderer = new T.WebGLRenderer({ canvas: $('sky'), antialias: !slowGpu && !mobile, powerPreference: 'high-performance' }); }
  catch (e) { $('note').textContent = '이 기기에서는 3D 화면을 켤 수 없습니다.'; return; }
  var basePR = slowGpu ? 0.6 : Math.min(devicePixelRatio || 1, mobile ? 2 : 1.25), quality = 1;
  renderer.setPixelRatio(basePR);
  // 갈대 사이에 서서 살짝 올려다보는 눈높이
  var camera = new T.PerspectiveCamera(64, 1, 0.1, 3000);
  camera.position.set(0, 2.4, 40);
  // 정면이 아니라 왼쪽 하늘을 비스듬히 올려다본다.
  camera.lookAt(-38, 22, -55);
  // 반듯하지 않게: 살짝 기울인 채 손에 든 카메라처럼 천천히 흔들린다.
  var baseQuat = camera.quaternion.clone(), swayQ = new T.Quaternion(), swayE = new T.Euler();
  function sway(t) {
    swayE.set(Math.sin(t * 0.31) * 0.008 + Math.sin(t * 0.83) * 0.002, Math.sin(t * 0.23) * 0.014, -0.07 + Math.sin(t * 0.19) * 0.008);
    camera.quaternion.copy(baseQuat).multiply(swayQ.setFromEuler(swayE));
  }

  /* ---------- 하늘 ---------- */
  var skyU = { top: { value: col(C.top) }, mid: { value: col(C.mid) }, low: { value: col(C.fog) } };
  var sky = new T.Mesh(new T.SphereGeometry(1400, 32, 16), new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, uniforms: skyU, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform vec3 top, mid, low; varying vec3 vDir;',
      'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }',
      'void main(){',
      '  float h = normalize(vDir).y;',
      '  vec3 c = mix(low, mid, smoothstep(0.0, 0.16, h));',
      '  c = mix(c, top, smoothstep(0.12, 0.6, h));',
      '  c += (hash(gl_FragCoord.xy) - 0.5) / 255.0;',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'].join('\n')
  }));
  scene3.add(sky);

  /* ---------- 땅 ---------- */
  var groundTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 256; var g = c.getContext('2d');
    g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
    for (var i = 0; i < 2600; i++) { var v = 90 + Math.random() * 90 | 0; g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.25)'; g.beginPath(); g.ellipse(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 14, 1 + Math.random() * 5, Math.random() * 3, 0, 6.283); g.fill(); }
    var t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(80, 80); t.anisotropy = 4; return t;
  })();
  // 완만하게 출렁이다가 멀리서 언덕으로 올라가는 땅
  function hillAt(x, z) {
    var far = Math.max(0, 30 - z);
    var amp = Math.min(1, far / 70);
    return amp * (2.6 * Math.sin(x * 0.021 + 0.6) + 1.7 * Math.sin(x * 0.047 + z * 0.031 + 2.0) + 1.1 * Math.sin(z * 0.06 - x * 0.012))
      + far * 0.045 + Math.max(0, -x - 40) * 0.05 * amp;
  }
  var groundGeo = new T.PlaneGeometry(2400, 2400, slowGpu ? 90 : 160, slowGpu ? 90 : 160);
  groundGeo.rotateX(-Math.PI / 2);
  (function () {
    var gp = groundGeo.attributes.position;
    for (var i = 0; i < gp.count; i++) gp.setY(i, hillAt(gp.getX(i), gp.getZ(i)) - 0.05);
    groundGeo.computeVertexNormals();
  })();
  var ground = new T.Mesh(groundGeo, new T.MeshBasicMaterial({ map: groundTex, color: col(C.ground) }));
  scene3.add(ground);

  /* ---------- 지평선의 수풀 띠 ----------
     한 그루를 세우지 않고, 크기가 제각각인 덤불·관목·나무가 겹겹이 뭉친 띠를 만든다.
     작은 덩어리 수천 개를 하나의 기하로 합쳐서 그리기 한 번에 끝낸다. */
  var treeMat = new T.MeshBasicMaterial({ color: col(C.tree), vertexColors: true });
  (function () {
    var blob = new T.IcosahedronGeometry(1, 0).toNonIndexed();   // 안개 속 실루엣이라 각이 안 보인다
    var bp = blob.attributes.position, parts = [], cols = [];
    var m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), v = new T.Vector3(), sc = new T.Vector3();
    function puff(x, y, z, sx, sy, sz, shade) {
      e.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); q.setFromEuler(e);
      m4.compose(v.set(x, y + hillAt(x, z), z), q, sc.set(sx, sy, sz));
      for (var i = 0; i < bp.count; i++) {
        var p = new T.Vector3(bp.getX(i), bp.getY(i), bp.getZ(i));
        // 덩어리 표면을 울퉁불퉁하게 흔든다.
        p.multiplyScalar(0.8 + Math.random() * 0.35).applyMatrix4(m4);
        parts.push(p.x, p.y, p.z);
        var s = shade * (0.85 + Math.random() * 0.2); cols.push(s, s, s);
      }
    }
    function stem(x, z, h, w) {
      for (var t = 0; t < 1; t += 0.12) puff(x + (Math.random() - .5) * w, h * t, z, w * 0.35, h * 0.08, w * 0.35, 0.8);
    }
    // 덩어리 하나: 여러 줄기가 갈라진 키 작은 나무나 덤불
    function clump(cx, cz, height, width) {
      var trunks = 1 + Math.floor(Math.random() * 3);
      for (var t = 0; t < trunks; t++) stem(cx + (Math.random() - .5) * width * 0.5, cz, height * 0.55, 0.7);
      var n = Math.round((width * height * 0.35 + 8) * (slowGpu ? 0.5 : 1));
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 6.283, r = Math.sqrt(Math.random());
        var px = cx + Math.cos(a) * r * width * 0.5, pz = cz + Math.sin(a) * r * width * 0.25;
        // 위로 갈수록 좁아지는 불규칙한 윤곽
        var top = height * (0.55 + 0.45 * (1 - r * r)) * (0.75 + Math.random() * 0.4);
        var py = top * (0.35 + Math.random() * 0.65);
        var s = 0.9 + Math.random() * 2.2;
        puff(px, py, pz, s * 1.3, s, s, 1);
      }
    }
    // 앞쪽 띠: 덤불과 관목이 거의 이어진다.
    for (var x = -520; x < 260; x += 6 + Math.random() * 10) {
      if (Math.random() < 0.12) { x += 14; continue; }             // 사이사이 빈틈
      clump(x, -88 - Math.random() * 16, 4 + Math.random() * 7, 8 + Math.random() * 14);
    }
    // 뒤쪽 띠: 키 큰 나무 무리가 듬성듬성
    for (var x2 = -600; x2 < 300; x2 += 18 + Math.random() * 30) {
      clump(x2, -112 - Math.random() * 30, 10 + Math.random() * 9, 14 + Math.random() * 18);
    }
    // 아주 먼 덤불 줄
    for (var x3 = -800; x3 < 500; x3 += 20 + Math.random() * 30) clump(x3, -260 - Math.random() * 80, 6 + Math.random() * 6, 20 + Math.random() * 20);
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(parts, 3));
    g.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
    scene3.add(new T.Mesh(g, treeMat));
  })();
  // 들판에 박힌 나무 기둥 몇 개
  (function () {
    var postMat = new T.MeshBasicMaterial({ color: col(C.tree) });
    for (var p = 0; p < 4; p++) {
      var post = new T.Mesh(new T.BoxGeometry(0.25, 2.2, 0.25), postMat);
      var ppx = 14 + p * 7 + Math.random() * 3, ppz = -70 - Math.random() * 10;
      post.position.set(ppx, 1.1 + hillAt(ppx, ppz), ppz);
      scene3.add(post);
    }
  })();

  /* ---------- 바람에 흔들리는 갈대 ---------- */
  var reedU = T.UniformsUtils.merge([T.UniformsLib.fog, { time: { value: 0 }, colA: { value: col(C.reedA) }, colB: { value: col(C.reedB) }, plume: { value: col(C.plume) } }]);
  var reedGeo = new T.InstancedBufferGeometry();
  (function () {
    var p = [], segs = 7;
    for (var i = 0; i < segs; i++) {
      var y0 = i / segs, y1 = (i + 1) / segs;
      p.push(-0.5, y0, 0, 0.5, y0, 0, 0.5, y1, 0, -0.5, y0, 0, 0.5, y1, 0, -0.5, y1, 0);
    }
    reedGeo.setAttribute('position', new T.Float32BufferAttribute(p, 3));
    var off = new Float32Array(REEDS * 3), info = new Float32Array(REEDS * 4), extra = new Float32Array(REEDS);
    for (var k = 0; k < REEDS; k++) {
      var z, x, near = k < REEDS * (slowGpu ? 0.45 : 0.32);
      if (near) {            // 눈앞의 키 큰 갈대
        // 시야(왼쪽으로 크게 열려 있다)를 다 덮도록 깐다
        z = 37.5 - 30 * Math.pow(Math.random(), 0.8);
        x = -((40 - z) * 3.0 + 6) + Math.random() * ((40 - z) * 3.9 + 12);
      } else {
        z = 18 - 400 * Math.pow(Math.random(), 1.9);
        x = -((40 - z) * 3.0 + 12) + Math.random() * ((40 - z) * 3.9 + 24);
      }
      off[k * 3] = x; off[k * 3 + 1] = hillAt(x, z) - 0.05; off[k * 3 + 2] = z;
      // 가까울수록 낮게 두어 시야를 막지 않게 하고, 가끔 키 큰 줄기를 섞는다.
      var tall = Math.random() < 0.12 ? 1.6 : 1;
      info[k * 4] = (near ? 0.6 + Math.min(1, (40 - z) / 26) * 1.0 + Math.random() * 0.5 : 0.8 + Math.random() * 1.1) * tall;
      info[k * 4 + 1] = Math.random() * 6.283;
      info[k * 4 + 2] = Math.random();
      info[k * 4 + 3] = (near ? 0.018 + Math.random() * 0.016 : 0.05 + Math.random() * 0.05) * (slowGpu ? 1.5 : 1);
      extra[k] = Math.random() < (near ? 0.45 : 0.2) ? 1 : 0;   // 이삭이 달린 갈대
    }
    reedGeo.setAttribute('offset', new T.InstancedBufferAttribute(off, 3));
    reedGeo.setAttribute('info', new T.InstancedBufferAttribute(info, 4));
    reedGeo.setAttribute('head', new T.InstancedBufferAttribute(extra, 1));
    reedGeo.instanceCount = REEDS;
  })();
  var reeds = new T.Mesh(reedGeo, new T.ShaderMaterial({
    uniforms: reedU, side: T.DoubleSide, fog: true,
    vertexShader: [
      'attribute vec3 offset; attribute vec4 info; attribute float head; uniform float time; varying float vY; varying float vTint; varying float vHead;',
      '#include <fog_pars_vertex>',
      'void main(){',
      '  float y = position.y, h = info.x;',
      '  float gust = sin(time * 0.5 - offset.x * 0.03 + offset.z * 0.025) * 0.5 + 0.5;',
      '  float wave = sin(time * 2.3 + offset.x * 0.25 + offset.z * 0.19 + info.y) * 0.35;',
      '  float bend = (0.2 + gust * 0.8) * (0.7 + wave);',
      '  float plumeW = head * smoothstep(0.6, 0.78, y) * (1.0 - smoothstep(0.86, 1.0, y)) * 2.2;',
      '  float c = cos(info.y), s = sin(info.y);',
      '  vec3 p = vec3(position.x * info.w * (1.0 - y * 0.75 + plumeW), y * h, 0.0);',
      '  p.xz = vec2(p.x * c, p.x * s);',
      '  float b = bend * y * y;',
      '  p.x += b * h * 0.5; p.z += b * h * 0.15; p.y -= b * b * h * 0.1;',
      '  vec4 mvPosition = modelViewMatrix * vec4(p + offset, 1.0);',
      '  gl_Position = projectionMatrix * mvPosition;',
      '  vY = y; vTint = info.z; vHead = head * smoothstep(0.7, 0.8, y);',
      '  #include <fog_vertex>',
      '}'].join('\n'),
    fragmentShader: [
      'uniform vec3 colA, colB, plume; varying float vY; varying float vTint; varying float vHead;',
      '#include <fog_pars_fragment>',
      'void main(){',
      '  vec3 c = mix(colB, colA, smoothstep(0.0, 0.7, vY));',
      '  c = mix(c, plume, vHead);',
      '  c *= 0.8 + vTint * 0.35;',
      '  gl_FragColor = vec4(c, 1.0);',
      '  #include <fog_fragment>',
      '}'].join('\n')
  }));
  reeds.frustumCulled = false;
  scene3.add(reeds);

  /* ---------- 땅 위에 깔리는 안개 ---------- */
  var mistTex = (function () {
    // 투명 캔버스를 쓰면 아이폰 사파리에서 옅은 가장자리가 무지개 점으로 깨진다.
    // 그래서 검은 바탕에 흰색으로 짙기만 그리고, 이걸 투명도(alphaMap)로만 쓴다.
    var c = document.createElement('canvas'); c.width = 512; c.height = 128; var g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, 512, 128);
    for (var i = 0; i < 110; i++) {
      var x = Math.random() * 512, y = 64 + (Math.random() - .5) * 50, r = 20 + Math.random() * 60;
      for (var w = -1; w <= 1; w++) {
        var gr = g.createRadialGradient(x + w * 512, y, 0, x + w * 512, y, r);
        gr.addColorStop(0, 'rgba(255,255,255,0.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.fillRect(x + w * 512 - r, y - r, r * 2, r * 2);
      }
    }
    // 위아래 끝으로 갈수록 검게 덮어서 띠 모양으로 흐려지게 한다.
    var fade = g.createLinearGradient(0, 0, 0, 128);

    try { user = await window.claude.use('user'); } catch (e) { user = null; }
    if (user) { try { me = await user.id(); } catch (e) { me = null; } }
    if (!db) return;
    db.collection('words').limit(500).onSnapshot(function (snap) {
      var all = [];
      snap.docs.forEach(function (d) { var b = d.data(); if (b && Array.isArray(b.msgs)) all = all.concat(b.msgs); });
      pool = all.concat(localRows().map(function (r) { return r.msg; })).filter(function (m) { return typeof m === 'string' && m.trim(); });
    }, function () {});
    if (user && user.isOwner && user.isOwner()) {
      $('inboxBtn').hidden = false;
      $('inboxBtn').addEventListener('click', function () { $('inbox').hidden = !$('inbox').hidden; });
      db.collection('inbox').limit(500).onSnapshot(function (snap) {
        var rows = [];
        snap.docs.forEach(function (d) { var b = d.data(); if (b && Array.isArray(b.entries)) rows = rows.concat(b.entries); });
        rows.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
        var list = $('inboxList'); list.textContent = '';
        if (!rows.length) { var li = document.createElement('li'); li.textContent = '아직 받은 말이 없어요.'; list.appendChild(li); }
        rows.forEach(function (r) {
          var li = document.createElement('li'), b = document.createElement('b'), s = document.createElement('small');
          b.textContent = r.name || '익명'; li.appendChild(b); li.appendChild(document.createTextNode(r.msg || ''));
          s.textContent = fmt(r.at || 0); li.appendChild(s); list.appendChild(li);
        });
      }, function () {});
    }
  })();
  var saving = false;
  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var who = $('who').value.trim().slice(0, 12) || '익명';
    var msg = $('word').value.trim().slice(0, 8);
    if (!msg) { $('word').focus(); return; }
    if (saving) return;
    queue.unshift(msg);                 // 다음 차례에 새들이 띄운다
    nextShow = Math.min(nextShow, 6);
    $('word').value = ''; $('word').blur();
    if (useServer) {
      saving = true; pool.push(msg);
      try {
        var r = await callServer({ action: 'word', name: who, text: msg });
        hint(r && r.ok ? '보냈어요. 새들이 가끔 이 말을 띄울 거예요.' : (r && r.error) || '보내지 못했어요.');
      } catch (err) { saveLocal({ name: who, msg: msg, at: Date.now() }); hint('보내지 못했어요. 이 화면에서만 띄울게요.'); }
      saving = false; return;
    }
    if (!db || !me) { saveLocal({ name: who, msg: msg, at: Date.now() }); pool.push(msg); hint('남겼어요. 새들이 가끔 이 말을 띄울 거예요. (이 기기에만 저장돼요)'); return; }
    saving = true;
    try {
      var now = Date.now();
      var wref = db.doc('words/' + me), iref = db.doc('inbox/' + me);
      var w = await wref.get(), wm = (w.exists && Array.isArray(w.data().msgs)) ? w.data().msgs.slice(-29) : [];
      wm.push(msg);
      await wref.set({ msgs: wm });
      var ib = await iref.get(), ie = (ib.exists && Array.isArray(ib.data().entries)) ? ib.data().entries.slice(-99) : [];
      ie.push({ name: who, msg: msg, at: now });
      await iref.set({ entries: ie });
      hint('보냈어요. 새들이 가끔 이 말을 띄울 거예요.');
    } catch (err) {
      hint(err && err.code === 'quota_exceeded' ? '저장 공간이 꽉 찼어요. 이 화면에서만 띄울게요.' : '저장하지 못했어요. 이 화면에서만 띄울게요.');
    }
    saving = false;
  });
  /* ---------- 소리 (음악 없이 합성한 효과음) ----------
     바람, 갈대 쓸리는 소리, 새떼 날갯짓(가까울수록 크게), 가끔 먼 새 울음, 글자가 모일 때 쓸리는 소리 */
  var snd = null;
  function makeNoise(ac, sec) {
    var b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0), last = 0;
    for (var i = 0; i < d.length; i++) { var w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = i % 3 ? w * 0.5 : last * 3.5; }
    return b;
  }
  function loop(ac, buf, filterType, freq, q, gain, dest) {
    var s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
    var f = ac.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    var g = ac.createGain(); g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(dest); s.start(0, Math.random() * 3);
    return { f: f, g: g };
  }
  function startSound() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    var ac; try { ac = new AC(); } catch (e) { return null; }
    var master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    var buf = makeNoise(ac, 4);
    return {
      ac: ac, master: master, buf: buf,
      wind: loop(ac, buf, 'lowpass', 380, 0.4, 0.18, master),
      reeds: loop(ac, buf, 'bandpass', 3200, 0.7, 0.03, master),
      wings: loop(ac, buf, 'bandpass', 900, 0.9, 0.0, master),
      nextChirp: 2
    };
  }
  function chirp() {
    var ac = snd.ac, t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    var f0 = 2600 + Math.random() * 1600;
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * (Math.random() < .5 ? 1.4 : 0.7), t + 0.08);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.012 + Math.random() * 0.01, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g);
    if (p) { p.pan.value = Math.random() * 1.6 - 0.8; g.connect(p); p.connect(snd.master); } else g.connect(snd.master);
    o.start(t); o.stop(t + 0.14);
  }
  function swoosh() {
    if (!snd) return;
    var ac = snd.ac, t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = snd.buf; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1600, t + 2.2);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 1.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    s.connect(f); f.connect(g); g.connect(snd.master); s.start(t, Math.random() * 2); s.stop(t + 3.7);
  }
  function updateSound(dt) {
    if (!snd) return;
    var ac = snd.ac, t = ac.currentTime;
    var gust = Math.sin(simTime * 0.5) * 0.5 + 0.5;
    snd.wind.g.gain.setTargetAtTime(0.12 + gust * 0.12, t, 0.5);
    snd.wind.f.frequency.setTargetAtTime(280 + gust * 260, t, 0.5);
    snd.reeds.g.gain.setTargetAtTime(0.015 + gust * 0.05, t, 0.4);
    // 새떼 중심까지 거리 (일부만 표본으로)
    var sx = 0, sy = 0, sz = 0, k = 0;
    for (var i = 0; i < N; i += 37) { sx += pos[i * 3]; sy += pos[i * 3 + 1]; sz += pos[i * 3 + 2]; k++; }
    var dx = sx / k - camera.position.x, dy = sy / k - camera.position.y, dz = sz / k - camera.position.z;
    var dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    var near = Math.max(0, Math.min(1, (150 - dist) / 100));
    var flutter = 0.75 + 0.25 * Math.sin(simTime * 23) * Math.sin(simTime * 7.3);
    snd.wings.g.gain.setTargetAtTime(near * near * 0.16 * flutter, t, 0.15);
    snd.wings.f.frequency.setTargetAtTime(700 + near * 900, t, 0.3);
    snd.nextChirp -= dt;
    if (snd.nextChirp <= 0) {
      var burst = 1 + Math.floor(Math.random() * 4);
      for (var c = 0; c < burst; c++) setTimeout(function () { if (snd) chirp(); }, c * (60 + Math.random() * 120));
      snd.nextChirp = 0.6 + Math.random() * 3 * (1.2 - near);
    }
  }
  // 소리는 기본으로 켜 둔다. 브라우저가 첫 클릭·키 입력 전에는 소리를 막으므로,
  // 막혀 있으면 화면 어디든 처음 건드리는 순간 바로 나온다. 끈 사람은 다음에도 꺼진 채로.
  var soundOn = true;
  try { soundOn = localStorage.getItem('words_sound') !== 'off'; } catch (e) {}
  function applySound() {
    $('soundBtn').setAttribute('aria-pressed', soundOn);
    $('soundBtn').textContent = soundOn ? '소리 끄기' : '소리 켜기';
    if (soundOn && !snd) { snd = startSound(); if (!snd) { $('soundBtn').textContent = '소리 없음'; return; } }
    if (!snd) return;
    if (soundOn && !document.hidden) snd.ac.resume().catch(function () {}); else snd.ac.suspend();
  }
  function firstTouch(e) {
    if (e && e.target === $('soundBtn')) return;
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (n) { removeEventListener(n, firstTouch, true); });
    if (soundOn) applySound();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (n) { addEventListener(n, firstTouch, true); });
  $('soundBtn').addEventListener('click', function () {
    // 켜져 있는데 브라우저가 막아서 안 들리던 거라면, 이 클릭은 끄기가 아니라 "들리게"로 쓴다.
    if (soundOn && snd && snd.ac.state !== 'running') { snd.ac.resume().catch(function () {}); return; }
    soundOn = !soundOn;
    try { localStorage.setItem('words_sound', soundOn ? 'on' : 'off'); } catch (e) {}
    applySound();
  });
  applySound();
  document.addEventListener('visibilitychange', function () {
    if (!snd) return;
    if (document.hidden) snd.ac.suspend(); else if ($('soundBtn').getAttribute('aria-pressed') === 'true') snd.ac.resume();
  });

  // 가끔, 쌓인 말 중 하나를 새들이 은근히 띄운다.
  function tickMessages(dt) {
    if (mode !== 'free') return;
    nextShow -= dt;
    if (nextShow > 0) return;
    var text = queue.length ? queue.shift() : (pool.length ? pool[Math.floor(Math.random() * pool.length)] : null);
    nextShow = 28 + Math.random() * 26;
    if (text) { send(text); swoosh(); }
  }

  /* ---------- 루프 ---------- */
  var last = performance.now(), demo = 4, simTime = 0;
  function draw() {
    birdU.time.value = simTime; reedU.time.value = simTime;
    for (var i = 0; i < mists.length; i++) mists[i].material.alphaMap.offset.x = simTime * mists[i].userData.speed;
    if (!calm) sway(simTime);
    renderer.render(scene3, camera);
  }
  // 느리면 해상도를 단계적으로 낮춘다 (화면이 멈춘 듯 끊기는 것보다 살짝 흐린 게 낫다).
  // 창이 가려져 브라우저가 일부러 늦춘 프레임(0.25초 넘게 벌어진 것)은 세지 않는다.
  var perfT = 0, perfN = 0, perfPrev = 0;
  function adapt(now) {
    var gap = perfPrev ? now - perfPrev : 0; perfPrev = now;
    if (!gap || gap > 250 || document.hidden) return;
    perfT += gap; perfN++;
    if (perfT < 2000) return;
    var fps = perfN * 1000 / perfT;
    perfT = 0; perfN = 0;
    var floorQ = slowGpu ? 0.75 : 0.5;
    if (fps < 40 && quality > floorQ) {
      quality = Math.max(floorQ, quality * 0.8);
      renderer.setPixelRatio(basePR * quality); resize();
    }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (calm) dt *= 0.5;
    simTime += dt;
    adapt(now);
    step(dt);
    tickMessages(dt);
    updateSound(dt);
    draw();
  }
  requestAnimationFrame(frame);
  window.__flock = { scene: scene3, renderer: renderer, camera: camera, send: send, mode: function () { return mode; },
    onScreen: function () { var v = new T.Vector3(), k = 0; for (var i = 0; i < N; i++) { v.set(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]).project(camera); if (Math.abs(v.x) < 1 && Math.abs(v.y) < 1 && v.z < 1) k++; } return k / N; },
    bench: function (frames) { var t = performance.now(); for (var f = 0; f < frames; f++) { simTime += 1 / 60; step(1 / 60); } var s = (performance.now() - t) / frames; t = performance.now(); draw(); renderer.getContext().finish(); return { stepMs: s, renderMs: performance.now() - t, birds: N }; } };
})();
