<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>흡연충 뻑치기 · 배기원의 게임센터</title>
<link rel="stylesheet" href="../../css/base.css">
<style>
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { max-width: none; margin: 0; padding: 0; overflow: hidden; background: #0b0d14; touch-action: none; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100% - 32px)); background: #fff; color: #111; border: 2px solid #111; padding: 16px; display: grid; gap: 12px; }
  .panel h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  .panel p { margin: 0; font-size: 14px; color: #555; }
  .panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; border-top: 1px solid #111; }
  .panel dt, .panel dd { margin: 0; padding: 5px 0; border-bottom: 1px solid #111; font-size: 15px; }
  .panel dt { padding-right: 14px; color: #555; }
  .panel dd { text-align: right; font-family: var(--mono); font-weight: 700; }
  .panel button { padding: 10px; font-size: 17px; font-weight: 700; }
  .panel .row { display: flex; gap: 8px; }
  .panel .row button { flex: 1; }
  #hud { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); color: #fff; font: 700 16px/1.2 var(--mono); text-shadow: 0 1px 2px #000; pointer-events: none; }
  #stamBar { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 4px; margin-left: -60px; background: rgba(255,255,255,.2); pointer-events: none; }
  #stam { height: 100%; background: #fff; transform-origin: left; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; mix-blend-mode: difference; pointer-events: none; }
  #snd { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); font-size: 13px; }
  #snd[aria-pressed="true"] { background: #111; color: #fff; }
  #stick { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 110px; height: 110px; border: 2px solid #fff; border-radius: 50%; background: rgba(255,255,255,.12); pointer-events: none; }
  #nub { position: absolute; left: 33px; top: 33px; width: 40px; height: 40px; border-radius: 50%; background: #fff; }
  .tbtn { position: fixed; width: 76px; height: 76px; border-radius: 50%; font-weight: 700; font-size: 16px; }
  #hitBtn { right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; }
  #runBtn { right: max(130px, env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
  #runBtn[aria-pressed="true"] { background: #111; color: #fff; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" hidden></div>
<div id="stamBar" hidden><div id="stam"></div></div>
<div id="cross" hidden></div>
<button id="snd" type="button" aria-pressed="false">소리 켜기</button>
<div id="stick" hidden><div id="nub"></div></div>
<button id="runBtn" class="tbtn" type="button" hidden aria-pressed="false">달리기</button>
<button id="hitBtn" class="tbtn" type="button" hidden>뻑</button>

<section class="panel" id="startPanel">
  <h1>흡연충 뻑치기</h1>
  <p>WASD 이동 · Shift 달리기 · 좌클릭 뻑</p>
  <button id="go" type="button">시작</button>
</section>

<section class="panel" id="endPanel" hidden>
  <h1 id="endTitle"></h1>
  <dl id="endStats"></dl>
  <p id="endMsg"></p>
  <div class="row"><button id="again" type="button">다시</button><button id="home" type="button">게임 목록</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
