<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응속도 테스트 · 배기원의 게임센터</title>
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/comments.css">
<style>
  #pad {
    height: 300px;
    margin: 16px 0;
    border: 2px solid var(--line);
    display: grid;
    place-items: center;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    user-select: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  #pad small { display: block; font-size: 14px; font-weight: 400; margin-top: 4px; }
  #pad.wait { background: #ddd; }
  #pad.go { background: #0c0; color: #fff; }
  #pad.early { background: #c00; color: #fff; }
  .laps { font-family: var(--mono); font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  #msg { min-height: 1.5em; font-weight: 700; }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../../#/">배기원의 게임센터</a>
  <nav><a href="../../#/">게임</a><a href="../../#/rank/reaction">랭킹</a></nav>
</header>

<h1>반응속도 테스트</h1>
<p class="dim">화면이 초록색으로 바뀌면 바로 터치하세요. 5번 평균이 기록이 돼요.</p>
<div id="pad">시작하기<small>화면을 터치하세요</small></div>
<div class="laps" id="laps"></div>
<p id="msg"></p>

<section id="comments"></section>

<script type="module">
import { submitScore } from '../../js/gc.js?v=3';
import { mountComments } from '../../js/comments.js?v=3';
mountComments(document.getElementById('comments'), 'reaction');

const ROUNDS = 5;
const pad = document.getElementById('pad');
const laps = document.getElementById('laps');
const msg = document.getElementById('msg');
let state = 'idle', timer = 0, shownAt = 0, times = [];

function set(cls, text, sub = '') {
  pad.className = cls;
  pad.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
}

function showLaps() {
  laps.innerHTML = times.map((t, i) => `<span>${i + 1}회 ${t}ms</span>`).join('');
}

function next() {
  state = 'wait';
  set('wait', '기다리세요…', '초록색이 되면 터치');
  timer = setTimeout(() => { state = 'go'; shownAt = performance.now(); set('go', '지금!'); }, 900 + Math.random() * 2200);
}

async function finish() {
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  state = 'idle';
  set('', `평균 ${avg}ms`, '다시 하려면 터치하세요');
  msg.textContent = await submitScore('reaction', avg);
}

pad.addEventListener('pointerdown', () => {
  if (state === 'idle') { times = []; showLaps(); msg.textContent = ''; next(); }
  else if (state === 'wait') { clearTimeout(timer); state = 'early'; set('early', '너무 빨랐어요', '터치해서 다시 하기'); }
  else if (state === 'early') next();
  else if (state === 'go') {
    times.push(Math.round(performance.now() - shownAt));
    showLaps();
    if (times.length >= ROUNDS) finish();
    else next();
  }
});
</script>
</body>
</html>
