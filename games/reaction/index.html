<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응속도 테스트 · 배기원의 게임센터</title>
<link rel="stylesheet" href="../../css/base.css">
<style>
  #pad {
    height: 320px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    background: var(--primary);
    user-select: none;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .1s;
  }
  #pad small { display: block; font-size: 15px; font-weight: 500; opacity: .85; margin-top: 6px; }
  #pad.wait { background: #4e5968; }
  #pad.go { background: #12b886; }
  #pad.early { background: #f04452; }
  .laps { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .laps span { background: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #msg { margin-top: 14px; font-weight: 600; color: var(--primary); min-height: 1.5em; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="logo" href="../../#/">배기원의 게임센터</a>
    <nav><a href="../../#/">게임</a><a href="../../#/rank/reaction">랭킹</a></nav>
  </div>
</header>

<main class="wrap">
  <h1 class="page-title">반응속도 테스트</h1>
  <p class="page-sub">화면이 초록색으로 바뀌면 바로 터치하세요. 5번 평균이 기록이 돼요.</p>
  <div id="pad">시작하기<small>화면을 터치하세요</small></div>
  <div class="laps" id="laps"></div>
  <p id="msg"></p>
</main>

<script type="module">
import { submitScore } from '../../js/gc.js';

const ROUNDS = 5;
const pad = document.getElementById('pad');
const laps = document.getElementById('laps');
const msg = document.getElementById('msg');
let state = 'idle', timer = 0, shownAt = 0, times = [];

function set(cls, text, sub = '') {
  pad.className = cls;
  pad.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
}

function showLaps() {
  laps.innerHTML = times.map((t, i) => `<span>${i + 1}회 ${t}ms</span>`).join('');
}

function next() {
  state = 'wait';
  set('wait', '기다리세요…', '초록색이 되면 터치');
  timer = setTimeout(() => { state = 'go'; shownAt = performance.now(); set('go', '지금!'); }, 900 + Math.random() * 2200);
}

async function finish() {
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  state = 'idle';
  set('', `평균 ${avg}ms`, '다시 하려면 터치하세요');
  msg.textContent = await submitScore('reaction', avg);
}

pad.addEventListener('pointerdown', () => {
  if (state === 'idle') { times = []; showLaps(); msg.textContent = ''; next(); }
  else if (state === 'wait') { clearTimeout(timer); state = 'early'; set('early', '너무 빨랐어요', '터치해서 다시 하기'); }
  else if (state === 'early') next();
  else if (state === 'go') {
    times.push(Math.round(performance.now() - shownAt));
    showLaps();
    if (times.length >= ROUNDS) finish();
    else next();
  }
});
</script>
</body>
</html>
