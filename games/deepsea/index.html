<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심해 생물 만들기 · 배기원의 게임센터</title>
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/comments.css">
<style>
  .sea { position: relative; border: 2px solid var(--line); background: #02040a; margin: 14px 0 0; }
  .sea canvas { display: block; width: 100%; height: 320px; }
  .sea.big canvas { height: 440px; }
  .sea .tag { position: absolute; left: 10px; top: 8px; color: #cfd8e6; font: 12px/1.4 var(--mono); opacity: .8; pointer-events: none; }
  .sea .snd { position: absolute; right: 8px; top: 8px; font-size: 12px; padding: 3px 8px; background: #02040a; color: #cfd8e6; border-color: #cfd8e6; }
  .sea .snd[aria-pressed="true"] { background: #cfd8e6; color: #02040a; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 12px 0 4px; font-size: 13px; color: var(--dim); }
  .q { font-size: 19px; font-weight: 700; margin: 4px 0 12px; text-wrap: balance; }
  .q small { display: block; font-size: 13px; font-weight: 400; color: var(--dim); margin-bottom: 4px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 6px; }
  .opts button { text-align: left; white-space: normal; padding: 10px 12px; font-size: 15px; line-height: 1.35; }
  .kind { display: inline-block; font-size: 11px; border: 1px solid var(--line); padding: 0 6px; margin-right: 6px; vertical-align: 2px; }
  .start { display: grid; gap: 10px; margin: 16px 0; max-width: 420px; }
  .start input { font: inherit; padding: 8px 10px; border: 2px solid var(--line); }
  .start .row { display: flex; gap: 8px; }
  .start .row input { flex: 1; min-width: 0; }
  .card { margin: 14px 0; }
  .card h2 { font-size: 22px; margin: 0 0 2px; }
  .card .sci { font-style: italic; color: var(--dim); margin: 0 0 10px; }
  .card dl { display: grid; grid-template-columns: auto 1fr; margin: 0; border-top: 1px solid var(--line); }
  .card dt, .card dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .card dt { padding-right: 18px; color: var(--dim); font-size: 14px; }
  .card .mbti { font-family: var(--mono); font-weight: 700; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .dex { list-style: none; margin: 8px 0; padding: 0; border-top: 1px solid var(--line); }
  .dex li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .dex canvas { width: 64px; height: 64px; background: #02040a; flex: none; }
  .dex .meta { flex: 1; min-width: 0; }
  .dex .meta b { display: block; }
  .dex .meta span { font-size: 13px; color: var(--dim); }
  #msg { min-height: 1.5em; font-weight: 700; }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../../#/">배기원의 게임센터</a>
  <nav><a href="../../#/">게임</a><a href="../../#/rank/deepsea">랭킹</a></nav>
</header>

<h1>심해 생물 만들기</h1>
<p class="dim">질문에 답할 때마다 생물이 조금씩 바뀌어요. 중간중간 성격을 묻는 질문도 섞여 있어요.</p>

<div class="sea" id="sea"><canvas id="cv"></canvas><span class="tag" id="tag"></span><button type="button" class="snd" id="snd" aria-pressed="false">소리 켜기</button></div>
<main id="stage"></main>
<p id="msg"></p>

<h2>내 도감</h2>
<p class="dim" id="dexInfo"></p>
<ul class="dex" id="dex"></ul>

<section id="comments"></section>

<script type="module" src="game.js"></script>
</body>
</html>
